<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadReadRead - Desk Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus+Jakarta+Sans', sans-serif;
      background-color: #FFFDF6;
      background-image: radial-gradient(#18181B 0.75px, transparent 0.75px);
      background-size: 16px 16px;
    }
    .neo-border { border: 3px solid #18181B; }
    .neo-shadow { box-shadow: 5px 5px 0px #18181B; }
    .neo-shadow-sm { box-shadow: 3px 3px 0px #18181B; }
    .neo-btn { transition: all 0.1s ease; }
    .neo-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0px #18181B; }
    .neo-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #18181B; }
    
    @keyframes floatWorm {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .animate-float { animation: floatWorm 3.5s ease-in-out infinite; }
  </style>
</head>
<body class="p-3 sm:p-6 text-zinc-900 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md mx-auto neo-border neo-shadow bg-[#FFFDF6] rounded-3xl p-4 sm:p-6 space-y-4 relative">
    
    <!-- Top Bar: Clean controls without yellow box -->
    <div class="flex items-center justify-between gap-2">
      <button id="rainBtn" onclick="toggleRain()" class="neo-btn neo-border neo-shadow-sm bg-[#D8B4FE] px-3 py-1.5 rounded-full text-xs font-black flex items-center gap-1.5">
        <span>🌧️</span> <span id="rainText">Lo-Fi Rain</span>
      </button>
      
      <button onclick="toggleLang()" class="neo-btn neo-border neo-shadow-sm bg-white px-3 py-1.5 rounded-full text-xs font-black flex items-center gap-1">
        <span>🌐</span> <span id="langText">TH</span>
      </button>
    </div>

    <!-- Original Chips -->
    <div class="flex flex-wrap gap-2">
      <div class="bg-[#BBF7D0] neo-border neo-shadow-sm px-3 py-1 rounded-full text-xs font-extrabold flex items-center gap-1">
        <span>⭐</span> Bookworm Desk v2.0
      </div>
      <div class="bg-[#FFB7B2] neo-border neo-shadow-sm px-3 py-1 rounded-full text-xs font-extrabold flex items-center gap-1">
        <span>☕</span> Feeling: Super Cozy
      </div>
    </div>

    <!-- Original Thought Bubble -->
    <div class="bg-[#E1BEE7] neo-border neo-shadow-sm rounded-2xl p-3 text-center relative">
      <div class="absolute -top-3 left-4 bg-[#FEF08A] neo-border px-2 py-0.5 rounded-md text-[10px] font-black uppercase">
        Wormy's Thought
      </div>
      <p id="quoteText" class="font-bold text-xs sm:text-sm mt-1">"Have you taken a cozy reading pause today? 📖"</p>
    </div>

    <!-- Original Character Arena -->
    <div class="bg-[#F3E8FF] neo-border neo-shadow rounded-2xl p-6 flex flex-col items-center justify-center min-h-[220px] relative overflow-hidden">
      
      <div id="wormContainer" onclick="petWorm()" class="animate-float cursor-pointer transform hover:scale-105 transition-transform">
        <svg width="200" height="130" viewBox="0 0 200 130" fill="none">
          <!-- Stack of Books -->
          <rect x="30" y="95" width="140" height="20" rx="4" fill="#BBF7D0" stroke="#18181B" stroke-width="3"/>
          <rect x="20" y="110" width="160" height="18" rx="4" fill="#FFB7B2" stroke="#18181B" stroke-width="3"/>
          
          <!-- Worm Body Segments -->
          <circle cx="55" cy="85" r="22" fill="#86EFAC" stroke="#18181B" stroke-width="3"/>
          <circle cx="85" cy="78" r="22" fill="#86EFAC" stroke="#18181B" stroke-width="3"/>
          <circle cx="115" cy="82" r="22" fill="#86EFAC" stroke="#18181B" stroke-width="3"/>
          <circle cx="145" cy="70" r="26" fill="#86EFAC" stroke="#18181B" stroke-width="3"/>
          
          <!-- Beanie / Accessories -->
          <path d="M125 52 C125 40, 165 40, 165 52 Z" fill="#FF7043" stroke="#18181B" stroke-width="3"/>
          <circle cx="145" cy="38" r="7" fill="#FFF59D" stroke="#18181B" stroke-width="3"/>
          
          <!-- Eyes & Expression -->
          <circle cx="137" cy="68" r="5" fill="#18181B"/>
          <circle cx="153" cy="68" r="5" fill="#18181B"/>
          <path d="M140 76 Q145 80 150 76" stroke="#18181B" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

    </div>

    <!-- Original Stat Meters -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white neo-border neo-shadow-sm p-2.5 rounded-2xl text-center">
        <div class="text-[10px] font-black uppercase text-zinc-500">Hunger</div>
        <div id="hungerVal" class="font-extrabold text-sm sm:text-base">85%</div>
        <div class="w-full bg-zinc-100 neo-border h-2 rounded-full mt-1 overflow-hidden">
          <div class="bg-[#86EFAC] h-full w-[85%]"></div>
        </div>
      </div>
      <div class="bg-white neo-border neo-shadow-sm p-2.5 rounded-2xl text-center">
        <div class="text-[10px] font-black uppercase text-zinc-500">Mood</div>
        <div id="moodVal" class="font-extrabold text-sm sm:text-base">70%</div>
        <div class="w-full bg-zinc-100 neo-border h-2 rounded-full mt-1 overflow-hidden">
          <div class="bg-[#FEF08A] h-full w-[70%]"></div>
        </div>
      </div>
      <div class="bg-white neo-border neo-shadow-sm p-2.5 rounded-2xl text-center">
        <div class="text-[10px] font-black uppercase text-zinc-500">Energy</div>
        <div id="energyVal" class="font-extrabold text-sm sm:text-base">90%</div>
        <div class="w-full bg-zinc-100 neo-border h-2 rounded-full mt-1 overflow-hidden">
          <div class="bg-[#FFB7B2] h-full w-[90%]"></div>
        </div>
      </div>
    </div>

    <!-- Original Action Controls -->
    <div class="grid grid-cols-3 gap-2">
      <button onclick="feedWorm()" class="neo-btn neo-border neo-shadow-sm bg-[#BBF7D0] py-2.5 px-2 rounded-xl text-xs font-black flex items-center justify-center gap-1">
        <span>🧋</span> Feed
      </button>
      <button onclick="readWorm()" class="neo-btn neo-border neo-shadow-sm bg-[#FEF08A] py-2.5 px-2 rounded-xl text-xs font-black flex items-center justify-center gap-1">
        <span>📖</span> Read
      </button>
      <button onclick="cleanWorm()" class="neo-btn neo-border neo-shadow-sm bg-[#FFB7B2] py-2.5 px-2 rounded-xl text-xs font-black flex items-center justify-center gap-1">
        <span>🧹</span> Sweep
      </button>
    </div>

  </div>

  <script>
    function toggleRain() {
      const btn = document.getElementById('rainText');
      btn.innerText = btn.innerText === 'Lo-Fi Rain' ? 'Playing 🎵' : 'Lo-Fi Rain';
    }

    function toggleLang() {
      const lang = document.getElementById('langText');
      lang.innerText = lang.innerText === 'TH' ? 'EN' : 'TH';
    }

    function feedWorm() {}
    function readWorm() {}
    function cleanWorm() {}
    function petWorm() {}
  </script>
</body>
</html>
